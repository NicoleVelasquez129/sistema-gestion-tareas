<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/tareas.css">
</head>
<body>
    <header class="header">
        <div class="contenedor header__contenido">
            <div class="header__marca">
                <span class="header__logo">✓</span>
                <div>
                    <h1 class="header__titulo">Gestión de Tareas</h1>
                    <p class="header__subtitulo">Organiza tu día de forma simple</p>
                </div>
            </div>
            <div class="header__contador">
                <span id="contadorPendientes">0</span>
                <small>pendientes</small>
            </div>
        </div>
    </header>

    <main class="contenedor principal">
        <section class="panel">
            <h2 class="panel__titulo">Nueva tarea</h2>
            <form class="formulario" id="formularioTarea">
                <div class="formulario__campo formulario__campo--ancho">
                    <label class="formulario__etiqueta" for="titulo">Título</label>
                    <input class="formulario__input" type="text" id="titulo" placeholder="¿Qué necesitas hacer?" required>
                </div>
                <div class="formulario__campo">
                    <label class="formulario__etiqueta" for="prioridad">Prioridad</label>
                    <select class="formulario__input" id="prioridad">
                        <option value="baja">Baja</option>
                        <option value="media" selected>Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
                <div class="formulario__campo">
                    <label class="formulario__etiqueta" for="fecha">Fecha límite</label>
                    <input class="formulario__input" type="date" id="fecha">
                </div>
                <button class="boton boton--primario formulario__boton" type="submit">Agregar tarea</button>
            </form>
        </section>

        <section class="panel">
            <div class="tareas__encabezado">
                <h2 class="panel__titulo">Mis tareas</h2>
                <div class="filtros" id="filtros">
                    <button class="filtro filtro--activo" type="button" data-filtro="todas">Todas</button>
                    <button class="filtro" type="button" data-filtro="pendientes">Pendientes</button>
                    <button class="filtro" type="button" data-filtro="completadas">Completadas</button>
                </div>
            </div>
            <ul class="tareas" id="listaTareas"></ul>
            <p class="tareas__vacio" id="mensajeVacio">No hay tareas por aquí. ¡Agrega la primera!</p>
        </section>
    </main>

    <footer class="footer">
        <div class="contenedor footer__contenido">
            <p>Sistema de Gestión de Tareas · <span id="anioActual"></span></p>
        </div>
    </footer>

    <script>
        const formulario = document.getElementById('formularioTarea');
        const listaTareas = document.getElementById('listaTareas');
        const mensajeVacio = document.getElementById('mensajeVacio');
        const contadorPendientes = document.getElementById('contadorPendientes');
        const filtros = document.getElementById('filtros');
        // Dirección de la API del backend
        const URL_API = 'http://localhost:3000/api/tareas';

        let tareas = [];
        let filtroActual = 'todas';

        document.getElementById('anioActual').textContent = new Date().getFullYear();

        // Hace una petición a la API y devuelve el JSON (o lanza un error con el mensaje del servidor)
        async function llamarApi(ruta = '', opciones = {}) {
            const respuesta = await fetch(URL_API + ruta, {
                headers: { 'Content-Type': 'application/json' },
                ...opciones
            });
            if (respuesta.status === 204) return null;
            const datos = await respuesta.json();
            if (!respuesta.ok) {
                const detalles = datos.detalles ? '\n- ' + datos.detalles.join('\n- ') : '';
                throw new Error(datos.error + detalles);
            }
            return datos;
        }

        // Muestra un error al usuario (por ejemplo, si el servidor está apagado)
        function mostrarError(error) {
            console.error(error);
            const mensaje = error instanceof TypeError
                ? 'No se pudo conectar con el servidor. ¿Está encendido el backend (npm run dev)?'
                : error.message;
            alert(mensaje);
        }

        // Pide todas las tareas al backend y vuelve a dibujar la lista
        async function cargarTareas() {
            try {
                tareas = await llamarApi();
                renderizar();
            } catch (error) {
                mostrarError(error);
            }
        }

        // Evita que el texto escrito por el usuario se interprete como HTML
        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        formulario.addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('titulo').value.trim();
            if (!titulo) return;

            try {
                await llamarApi('', {
                    method: 'POST',
                    body: JSON.stringify({
                        titulo,
                        prioridad: document.getElementById('prioridad').value,
                        fecha: document.getElementById('fecha').value
                    })
                });
                formulario.reset();
                await cargarTareas();
            } catch (error) {
                mostrarError(error);
            }
        });

        filtros.addEventListener('click', (e) => {
            const boton = e.target.closest('.filtro');
            if (!boton) return;
            filtroActual = boton.dataset.filtro;
            document.querySelectorAll('.filtro').forEach((f) => f.classList.remove('filtro--activo'));
            boton.classList.add('filtro--activo');
            renderizar();
        });

        function renderizar() {
            listaTareas.innerHTML = '';

            const visibles = tareas.filter((tarea) => {
                if (filtroActual === 'pendientes') return !tarea.completada;
                if (filtroActual === 'completadas') return tarea.completada;
                return true;
            });

            visibles.forEach((tarea) => {
                const item = document.createElement('li');
                item.className = 'tarea' + (tarea.completada ? ' tarea--completada' : '');
                item.innerHTML = `
                    <label class="tarea__check">
                        <input type="checkbox" ${tarea.completada ? 'checked' : ''} data-id="${tarea.id}">
                        <span class="tarea__marca"></span>
                    </label>
                    <div class="tarea__contenido">
                        <p class="tarea__titulo">${escaparHtml(tarea.titulo)}</p>
                        <div class="tarea__meta">
                            <span class="prioridad prioridad--${tarea.prioridad}">${tarea.prioridad}</span>
                            ${tarea.fecha ? `<span class="tarea__fecha">📅 ${tarea.fecha}</span>` : ''}
                        </div>
                    </div>
                    <button class="boton boton--eliminar" type="button" data-eliminar="${tarea.id}">Eliminar</button>
                `;
                listaTareas.appendChild(item);
            });

            mensajeVacio.style.display = visibles.length === 0 ? 'block' : 'none';
            contadorPendientes.textContent = tareas.filter((t) => !t.completada).length;
        }

        // Marcar / desmarcar una tarea como completada
        listaTareas.addEventListener('change', async (e) => {
            if (!e.target.matches('input[type="checkbox"]')) return;
            try {
                await llamarApi('/' + e.target.dataset.id, {
                    method: 'PUT',
                    body: JSON.stringify({ completada: e.target.checked })
                });
            } catch (error) {
                mostrarError(error);
            }
            await cargarTareas();
        });

        // Eliminar una tarea
        listaTareas.addEventListener('click', async (e) => {
            const boton = e.target.closest('[data-eliminar]');
            if (!boton) return;
            try {
                await llamarApi('/' + boton.dataset.eliminar, { method: 'DELETE' });
            } catch (error) {
                mostrarError(error);
            }
            await cargarTareas();
        });

        // Al abrir la página, se cargan las tareas guardadas en el backend
        cargarTareas();
    </script>
</body>
</html>
